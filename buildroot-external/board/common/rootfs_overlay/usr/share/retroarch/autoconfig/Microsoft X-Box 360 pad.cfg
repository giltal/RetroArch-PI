# The GPi Case 2's built-in controls: a USB "Xbox 360 Controller" (045e:028e,
# kernel xpad). Also any wired Xbox 360 pad.
#
# Button indices follow RetroArch's udev rule (ascending evdev key code), from
# the pad's own capability list (2026-10-28: key 7cdb000000000000, abs 3003f):
#   304 BTN_SOUTH=0  305 EAST=1  307 NORTH=2  308 WEST=3  310 TL=4  311 TR=5
#   314 SELECT=6  315 START=7  316 MODE=8  317 THUMBL=9  318 THUMBR=10
# The d-pad is a hat (ABS_HAT0X/Y), the triggers are axes (ABS_Z/ABS_RZ).
# Recalbox's es_input.cfg for the case maps the same codes.
# Face buttons by position, as on the DS3: bottom = B, right = A.

input_driver = "udev"
input_device = "Microsoft X-Box 360 pad"
input_vendor_id = "1118"
input_product_id = "654"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_axis = "+2"
input_r2_axis = "+5"
input_select_btn = "6"
input_start_btn = "7"
input_l3_btn = "9"
input_r3_btn = "10"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"

# Hotkeys (see retroarch.cfg): the home button (MODE, the case's "hotkey") is
# the modifier. Same combos as the DS3's PS button.
input_enable_hotkey_btn = "8"
input_menu_toggle_btn = "2"
input_exit_emulator_btn = "7"
input_save_state_btn = "5"
input_load_state_btn = "4"
input_state_slot_decrease_btn = "h0left"
input_state_slot_increase_btn = "h0right"
