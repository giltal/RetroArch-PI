#
# SD card layout for the Allwinner boards (sunxi boot convention): Orange Pi
# Zero3, KickPi K2B.
#
#   0        8 KB   u-boot-sunxi-with-spl.bin = SPL + TF-A BL31 + U-Boot, raw,
#                   outside the partition table -- the BROM looks for the SPL
#                   at a fixed offset
#   p1       ext4   rootfs; kernel, DTBs and extlinux live in /boot inside it
#   p2       exFAT  ROMs, mounted at /opt/roms, readable from Windows so the
#                   card can be populated without booting the board
#
# The launcher hardcodes /opt/roms (see launcher/launcher.c). p2 is built,
# empty, by board/common/post-image.sh; /etc/init.d/S46card creates one folder
# per system on the first boot.
#
# Later: rootfs could become read-only squashfs. The exFAT
# partition already gives us the writable area that plan needs.
#
image sdcard.img {
	hdimage {
	}

	# The BROM looks for the SPL at 8 KB into the boot medium.
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K # 1MB - 8KB
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}

	# 0x07 = exFAT (shared with NTFS); Windows identifies exFAT by its boot sector.
	partition roms {
		partition-type = 0x07
		image = "roms.exfat"
	}
}
