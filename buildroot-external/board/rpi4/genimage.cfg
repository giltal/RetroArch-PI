#
# SD card layout for the Raspberry Pi 4 (see docs/boards/rpi4.md):
#
#   p1  FAT32  boot: VideoCore firmware, config.txt, cmdline.txt, kernel, DTB,
#              overlays. The Pi's boot ROM/EEPROM looks for it as the first
#              FAT partition. Not mounted at runtime.
#   p2  ext4   rootfs (read-only once step 4 of the plan is done)
#   p3  ext4   /data: the little that must persist (empty as built)
#   p4  exFAT  ROMs, mounted at /opt/roms, readable from Windows; last, so it
#              takes the rest of the card and can be grown afterwards
#
# p2-p4 keep the H616 layout's roles and sizes. The whole image is 4 MiB +
# 64 + 1024 + 64 MiB + the ROM partition (post-image.sh, 27648 MiB by
# default) = 28804 MiB (30.20e9 bytes), which still fits the smallest
# "32 GB" cards seen (~30.5e9).
#
# The ROM partition is built empty by board/common/post-image.sh;
# /etc/init.d/S46card creates one folder per system on the first boot.
#
image boot.vfat {
	vfat {
		label = "RPI-BOOT"
		files = {
			"rpi-firmware/start4.elf",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/overlays",
			"bcm2711-rpi-4-b.dtb",
			"Image"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "RETRODATA"
		use-mke2fs = true
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		# 4 MiB: SD cards erase in 4 MiB units, so partitions start on one.
		align = 4M
	}

	partition boot {
		partition-type = 0x0C
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 1024M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}

	# 0x07 = exFAT (shared with NTFS); Windows identifies exFAT by its boot sector.
	partition roms {
		partition-type = 0x07
		image = "roms.exfat"
	}
}
